# Bot de señales Tanatabot (y el de scalping, carpeta scalping/): siempre encendido en la nube de GitHub (repositorio público = minutos ilimitados).
# Cada ejecución revisa el mercado cada 15 minutos durante ~5 h 40 min y, al terminar, lanza la siguiente.
# El cron es solo un respaldo por si la cadena se corta. El token y el chat son secretos cifrados.
name: Señales Tanatabot

on:
  schedule:
    - cron: "7 */2 * * *"   # respaldo cada 2 horas (si ya hay una en marcha, espera en cola)
  workflow_dispatch:

permissions:
  contents: write           # guardar signals_state.json (evita señales repetidas)
  actions: write            # lanzar la siguiente ejecución al terminar

concurrency:
  group: senales
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Bucle de señales (cada 15 min durante ~5 h 40 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TELEGRAM_NEWS_TARGET: ${{ secrets.TELEGRAM_NEWS_TARGET }}
        run: |
          git config user.name "tanatabot"
          git config user.email "tanatabot@users.noreply.github.com"
          end=$((SECONDS + 320*60))   # margen para el modo en directo dentro del límite de 6 h
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase || true
            bun signals.ts --once || echo "pasada con error, se reintenta en 15 min"
            # bot de scalping (grupo "Tanatabot Scalping"): solo actúa cuando cierra una vela de 1h nueva
            bun scalping/scalp.ts --once || echo "scalping con error, se reintenta en 15 min"
            git add signals_state.json scalping/scalp_state.json 2>/dev/null || git add signals_state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "estado de señales"
              git push -q || (git pull -q --rebase && git push -q) || echo "no se pudo guardar el estado, se reintenta"
            fi
            # espera 15 min; si hay un dato fuerte dentro de ese tiempo, se queda en directo y lo publica al momento
            bun signals.ts --wait || sleep 900
            git add signals_state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "estado de señales"
              git push -q || (git pull -q --rebase && git push -q) || echo "no se pudo guardar el estado"
            fi
          done

      - name: Lanzar la siguiente ejecución
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run senales.yml --ref main
